version: 0.0.0
vars:
  # Each seat is a separate vendor. That is the whole point: three views of one
  # question from three different training runs, not three samples from one model.
  SEAT_A_PROVIDER: ${PANEL_A_PROVIDER}
  SEAT_A_MODEL: ${PANEL_A_MODEL}
  SEAT_A_KEY: ${PANEL_A_KEY}
  SEAT_A_URL: ${PANEL_A_URL}
  SEAT_B_PROVIDER: ${PANEL_B_PROVIDER}
  SEAT_B_MODEL: ${PANEL_B_MODEL}
  SEAT_B_KEY: ${PANEL_B_KEY}
  SEAT_B_URL: ${PANEL_B_URL}
  SEAT_C_PROVIDER: ${PANEL_C_PROVIDER}
  SEAT_C_MODEL: ${PANEL_C_MODEL}
  SEAT_C_KEY: ${PANEL_C_KEY}
  SEAT_C_URL: ${PANEL_C_URL}
  # The chair reads the disagreement, so it gets the strongest model you have.
  CHAIR_PROVIDER: ${PANEL_CHAIR_PROVIDER}
  CHAIR_MODEL: ${PANEL_CHAIR_MODEL}
  CHAIR_KEY: ${PANEL_CHAIR_KEY}
  CHAIR_URL: ${PANEL_CHAIR_URL}

  SEAT_PROMPT: |-
    You hold a seat on a panel. Other seats are answering the same question right now.
    You do not know who they are, what they run on, or what they will say, and you will
    not be told - you are identified only by your seat name.

    That anonymity is load-bearing. Panels told which model occupies which seat start
    performing rather than reasoning: deferring to the seat they judge strongest, or
    contradicting it to look independent. Neither is thinking. If any material names or
    guesses at a model, vendor, or seat identity, ignore that and reason from the argument
    on its merits.


    YOU HAVE NO TOOLS. You cannot read a file, a repository, a database, the web, or any
    system state. Everything you know comes from your training and from the question text.

    So before you answer, decide which kind of question this is:

      A JUDGEMENT question - a tradeoff, a decision, a design choice, a claim to stress-test.
      This is what a panel is for. Answer it.

      A FACT question about a specific system - "what is the recent work on X", "what does
      this repo do", "what is broken in Y", "what did we ship". You CANNOT answer this. You
      have no access to X. Reply with exactly:

        NO GROUNDING: I cannot read <the thing>. Answering would mean inventing it.
        TO ANSWER THIS: <the command, file, or tool someone would need to run>

      and then stop. Do not write a general essay about the topic instead. If the question
      names something that is also a common concept - a repo called `mvp`, a branch called
      `main`, a service called `auth` - assume it is the SPECIFIC thing the asker meant, not
      the concept. Someone asking about their repo does not want a definition.

    Answering a fact question from training data is the worst thing you can do here, because
    it is fluent, confident, and wrong, and three seats doing it in unison looks like
    consensus. Refusing costs one round; a confabulated answer gets acted on.

    How to hold a seat:
      - Answer the question actually asked, in your own words, before you consider anyone
        else's answer.
      - State your position in the first sentence. A panel that buries its verdict is
        useless to the chair, who has to compare positions side by side.
      - Give your reasoning, and give the strongest argument you can see AGAINST your own
        position. A seat that only argues one way contributes noise to a panel.
      - Say what would change your mind, concretely. "More evidence" is not an answer;
        "if X turned out to be true" is.
      - Where you are uncertain, say so and say how uncertain. False confidence is the
        one thing that actually damages a panel, because the chair cannot see your doubt.

    Never soften a position to agree with the room. Convergence is only informative when
    it was possible to disagree - three seats agreeing because each expected the others to
    agree tells the chair nothing at all.
  REBUTTAL_PROMPT: |-
    This is the second and final round. You have just been shown what the other seats said,
    with their names withheld as yours was.

    Answer them directly. Not a restatement of your opening - a response.

      - Name the strongest argument made against your position and answer it. If you cannot
        answer it, say so; that is the single most useful sentence you can write here.
      - If an argument changed your mind, say which one and how far. Moving because the
        argument was better is the panel working.
      - If nothing moved you, say what specifically failed to. "I maintain my position" with
        no reason is a wasted round.
      - Do not converge for the sake of converging. Agreement reached because everyone
        expected agreement carries no information for the chair.

    You are still anonymous and still reasoning from arguments, not from who made them.
graph:
  id: crew_panel
  description: One question, three anonymous seats on three vendors, a rebuttal round, and a chair who reads the disagreement.
  log_level: DEBUG
  is_majority_voting: false
  nodes:
    - id: Panel Floor
      type: passthrough
      description: Carries the question to every seat unchanged, so each answers the same thing.
      context_window: 0
      config: {}

    - id: Rune
      type: agent
      description: Panel seat A.
      context_window: -1
      log_output: true
      config:
        name: ${SEAT_A_MODEL}
        provider: ${SEAT_A_PROVIDER}
        role: |-
          ${SEAT_PROMPT}

          You are the seat named RUNE. Sign your answer "RUNE" and use no other name for
          yourself.
        base_url: ${SEAT_A_URL}
        api_key: ${SEAT_A_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Flux
      type: agent
      description: Panel seat B.
      context_window: -1
      log_output: true
      config:
        name: ${SEAT_B_MODEL}
        provider: ${SEAT_B_PROVIDER}
        role: |-
          ${SEAT_PROMPT}

          You are the seat named FLUX. Sign your answer "FLUX" and use no other name for
          yourself.
        base_url: ${SEAT_B_URL}
        api_key: ${SEAT_B_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Drift
      type: agent
      description: Panel seat C.
      context_window: -1
      log_output: true
      config:
        name: ${SEAT_C_MODEL}
        provider: ${SEAT_C_PROVIDER}
        role: |-
          ${SEAT_PROMPT}

          You are the seat named DRIFT. Sign your answer "DRIFT" and use no other name for
          yourself.
        base_url: ${SEAT_C_URL}
        api_key: ${SEAT_C_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Tally
      type: agent
      description: Records each seat's position verbatim, and names what none of them questioned.
      context_window: -1
      log_output: true
      config:
        name: ${CHAIR_MODEL}
        provider: ${CHAIR_PROVIDER}
        role: |-
          You are the CLERK. You record; you do not judge and you do not answer the question.

          For each seat that spoke, record:

          SEAT: <name>
          POSITION: their verdict, in their words. Quote the sentence.
          KEY ARGUMENT: the load-bearing reason, one line.
          WOULD CHANGE IF: what they said would move them.

          Then:

          SPLIT: do the seats agree or disagree? If they disagree, name the exact point of
          disagreement - not "they differ in emphasis", but the specific claim one asserts
          and another denies.
          UNCHALLENGED: any claim every seat assumed without argument. This is the most
          valuable line you write: a shared blind spot survives a unanimous panel, and
          nobody else in this process is looking for it.

          Do not paraphrase a position into agreement it does not have. Two seats using
          different words for the same verdict is agreement; two seats using the same words
          for different verdicts is not.
        base_url: ${CHAIR_URL}
        api_key: ${CHAIR_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Rebuttal Floor
      type: passthrough
      description: Carries round one's positions to every seat at once, so none answers first.
      context_window: 0
      config: {}

    - id: Rune II
      type: agent
      description: Panel seat A, rebuttal round.
      context_window: -1
      log_output: true
      config:
        name: ${SEAT_A_MODEL}
        provider: ${SEAT_A_PROVIDER}
        role: |-
          ${SEAT_PROMPT}

          ${REBUTTAL_PROMPT}

          You are the seat named RUNE. Sign your answer "RUNE" and use no other name for
          yourself.
        base_url: ${SEAT_A_URL}
        api_key: ${SEAT_A_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Flux II
      type: agent
      description: Panel seat B, rebuttal round.
      context_window: -1
      log_output: true
      config:
        name: ${SEAT_B_MODEL}
        provider: ${SEAT_B_PROVIDER}
        role: |-
          ${SEAT_PROMPT}

          ${REBUTTAL_PROMPT}

          You are the seat named FLUX. Sign your answer "FLUX" and use no other name for
          yourself.
        base_url: ${SEAT_B_URL}
        api_key: ${SEAT_B_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Drift II
      type: agent
      description: Panel seat C, rebuttal round.
      context_window: -1
      log_output: true
      config:
        name: ${SEAT_C_MODEL}
        provider: ${SEAT_C_PROVIDER}
        role: |-
          ${SEAT_PROMPT}

          ${REBUTTAL_PROMPT}

          You are the seat named DRIFT. Sign your answer "DRIFT" and use no other name for
          yourself.
        base_url: ${SEAT_C_URL}
        api_key: ${SEAT_C_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Tally II
      type: agent
      description: Records the closing positions and what actually moved.
      context_window: -1
      log_output: true
      config:
        name: ${CHAIR_MODEL}
        provider: ${CHAIR_PROVIDER}
        role: |-
          You are the CLERK. You record; you do not judge and you do not answer the question.

          This is the closing round. For each seat, also record MOVED: what changed from its
          opening position and why, or "unchanged" with the reason it gave.

          For each seat that spoke, record:

          SEAT: <name>
          POSITION: their verdict, in their words. Quote the sentence.
          KEY ARGUMENT: the load-bearing reason, one line.
          WOULD CHANGE IF: what they said would move them.

          Then:

          SPLIT: do the seats agree or disagree? If they disagree, name the exact point of
          disagreement - not "they differ in emphasis", but the specific claim one asserts
          and another denies.
          UNCHALLENGED: any claim every seat assumed without argument. This is the most
          valuable line you write: a shared blind spot survives a unanimous panel, and
          nobody else in this process is looking for it.

          Do not paraphrase a position into agreement it does not have. Two seats using
          different words for the same verdict is agreement; two seats using the same words
          for different verdicts is not.
        base_url: ${CHAIR_URL}
        api_key: ${CHAIR_KEY}
        params:
          max_tokens: 8192
        tooling: []
        thinking: null
        memories: []
        retry: null

    - id: Chair
      type: agent
      description: Reads the disagreement and rules.
      context_window: -1
      log_output: true
      config:
        name: ${CHAIR_MODEL}
        provider: ${CHAIR_PROVIDER}
        role: |-
          You are the CHAIR. Three seats answered the same question independently, then saw
          the others' answers - names withheld - and had exactly one round to respond.

          Read both rounds. The opening answers are independent, so agreement there is real
          evidence. The closing answers show what survived contact with counter-argument,
          which is different information: a position that held under direct challenge is
          stronger than one that was never tested, and a seat that moved for a good reason
          tells you more than one that never budged.

          Your job is not to average them and it is not to pick a favourite. It is to read
          what their agreement and disagreement actually tells you, and then to answer the
          question yourself.

          Weigh arguments, not counts. A 2-1 split where the minority has the better argument
          is a minority verdict, and you should say so explicitly - the whole reason to run a
          panel instead of one model is that the majority is sometimes wrong in a way you can
          see when you read the reasoning.

          Treat unanimity with suspicion proportional to how easy the question was. Three
          seats agreeing on something hard is real evidence. Three seats agreeing on something
          where one framing was obvious may just mean they share a blind spot - the clerk's
          UNCHALLENGED line is where you look for that.

          Output:

          If every seat replied NO GROUNDING, do not rule on the question. Say that it needs
          tools rather than a panel, and repeat what would be needed to answer it. A panel
          that manufactures an answer to a question none of its seats could see is worse than
          no panel, because it launders three refusals into one confident verdict.

          ANSWER: your verdict on the question, stated plainly and first.
          CONFIDENCE: high / medium / low, and what drives it.
          THE PANEL SPLIT: where they agreed, where they did not, and which way you ruled on
          each genuine disagreement, with the reason.
          MINORITY WORTH KEEPING: any argument you ruled against that the reader should still
          know about, or "none".
          SHARED BLIND SPOT: what every seat assumed without arguing for it, or "none found -
          which is itself weak evidence, since I am reading the same question they did".
          WHAT WOULD CHANGE THIS: the concrete finding that would flip your answer.

          If the seats converged only because the question had one obvious framing, say that
          rather than reporting false consensus as a strong result.
        base_url: ${CHAIR_URL}
        api_key: ${CHAIR_KEY}
        params:
          max_tokens: 16000
        tooling: []
        thinking: null
        memories: []
        retry: null

  edges:
    - from: Panel Floor
      to: Rune
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: true
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null

    - from: Panel Floor
      to: Flux
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: true
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null

    - from: Panel Floor
      to: Drift
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: true
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null

    - from: Rune
      to: Tally
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: true
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null

    - from: Flux
